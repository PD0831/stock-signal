name: Refresh MVS dashboard snapshots

on:
  workflow_dispatch:
  schedule:
    # Broad UTC window; the XNYS calendar gate handles DST, holidays and early closes.
    - cron: '*/15 13-21 * * 1-5'

concurrency:
  group: mvs-dashboard-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.market-hours.outputs.should_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.lock

      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements-actions.lock

      - name: Check NYSE market hours
        id: market-hours
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/nyse_market_hours.py

      - name: Build snapshots
        if: steps.market-hours.outputs.should_run == 'true'
        run: python scripts/build_dashboard_snapshots.py --output-dir data

      - name: Upload snapshots
        if: steps.market-hours.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mvs-dashboard-snapshots
          path: |
            data/dashboard_snapshot.json
            data/breadth_15m.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mvs-dashboard-snapshots
          path: data

      - name: Validate snapshot pair
        run: >-
          python scripts/validate_dashboard_snapshots.py
          data/dashboard_snapshot.json data/breadth_15m.json

      - name: Commit updated snapshots
        run: |
          git add -- data/dashboard_snapshot.json data/breadth_15m.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh MVS dashboard snapshots"
          git push origin HEAD:${GITHUB_REF_NAME}
