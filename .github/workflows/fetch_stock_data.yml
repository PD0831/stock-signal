name: Fetch Stock Data

on:
  schedule:
    # Run at 02:00 UTC daily (after US market close + data settle)
    - cron: "0 2 * * *"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      - name: Install Python dependencies
        run: pip install yfinance pandas lxml requests --quiet

      - name: Fetch stock data
        run: python scripts/fetch_stock_data.py

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update stock data $(date -u +%Y-%m-%d)" && \
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
